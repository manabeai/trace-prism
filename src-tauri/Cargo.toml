[package]
name = "traceprism-desktop"
version = "0.1.0-preview.2"
description = "TracePrism desktop visualizer"
license = "MIT"
repository = "https://github.com/manabeai/algo-vis"
edition = "2024"
rust-version = "1.89"

[lib]
name = "traceprism_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri = { version = "2.11.6", features = [] }
traceprism = { path = "../sdk/rust" }
