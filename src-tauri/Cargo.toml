[package]
name = "traceprism-desktop"
version = "0.2.1-preview.1"
description = "TracePrism desktop visualizer"
license = "MIT"
repository = "https://github.com/manabeai/trace-prism"
edition = "2024"
rust-version = "1.90"

[lib]
name = "traceprism_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri = { version = "2.12.2", features = [] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.13.2"
traceprism = "=0.1.0-preview.3"
