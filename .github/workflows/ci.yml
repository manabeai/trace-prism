name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:storybook
      - run: node protocol/v2/validate.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path sdk/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path sdk/rust/Cargo.toml
      - run: cargo test --manifest-path examples/Cargo.toml

  desktop:
    needs: [web, rust]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --bundles deb --ci --no-sign
            targets: ''
          - os: macos-latest
            args: --bundles dmg --ci --no-sign --target aarch64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: macos-latest
            args: --bundles dmg --ci --no-sign --target x86_64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis --ci --no-sign
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build desktop bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
      - name: Build and upload draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TracePrism ${{ github.ref_name }} (preview)
          releaseBody: Linux、macOS、Windows 向けのプレビュー版です。各 OS のインストーラーを添付しています。
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify native installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '
            [.assets[].name]
            | (map(select(endswith(".dmg"))) | length == 2)
              and (map(select(endswith(".deb"))) | length == 1)
              and (map(select(endswith(".exe"))) | length == 1)
          ')" = true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
