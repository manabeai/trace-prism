name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:storybook
      - run: node protocol/v2/validate.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path examples/Cargo.toml -- --check
      - run: cargo test --manifest-path examples/Cargo.toml --locked

  desktop:
    needs: [web, examples]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 4 }}
      matrix:
        include:
          - os: ubuntu-latest
            args: --bundles deb,appimage --ci
            targets: ''
          - os: macos-latest
            args: --bundles app,dmg --ci --target aarch64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: macos-latest
            args: --bundles app,dmg --ci --target x86_64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis --ci
            targets: ''
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build desktop bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }} --no-sign --config src-tauri/tauri.ci.conf.json
          uploadWorkflowArtifacts: true
      - name: Build and upload draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TracePrism ${{ github.ref_name }} (preview)
          releaseBody: Linux、macOS、Windows 向けのプレビュー版です。アプリ内更新には Linux の AppImage、macOS のアプリ、Windows の NSIS インストーラーを利用します。Debian パッケージは手動更新です。
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: true

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify native installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '
            [.assets[].name]
            | (map(select(endswith(".dmg"))) | length == 2)
              and (map(select(endswith(".deb"))) | length == 1)
              and (map(select(endswith(".AppImage"))) | length == 1)
              and (map(select(endswith(".exe"))) | length == 1)
          ')" = true
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/traceprism-updates"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP/traceprism-updates"
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/traceprism-updates/assets.json"
          node .github/scripts/normalize-updater-manifest.mjs \
            "$RUNNER_TEMP/traceprism-updates/latest.json" \
            "$RUNNER_TEMP/traceprism-updates/assets.json" \
            "$GITHUB_REF_NAME"
          node .github/scripts/validate-updater-manifest.mjs \
            "$RUNNER_TEMP/traceprism-updates/latest.json" \
            "$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')" \
            "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/traceprism-updates/latest.json" --clobber
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
      - name: Update preview channel
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin preview-updates >/dev/null; then
            git fetch origin preview-updates
            git switch -C preview-updates origin/preview-updates
          else
            git switch --orphan preview-updates
          fi
          cp "$RUNNER_TEMP/traceprism-updates/latest.json" latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m "Update preview feed to $GITHUB_REF_NAME"
          git push origin HEAD:preview-updates
