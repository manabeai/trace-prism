name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node protocol/v2/validate.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path sdk/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path sdk/rust/Cargo.toml
      - run: cargo test --manifest-path examples/Cargo.toml
