<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>Algorithm Visualizer — Impeccableで改善したWorkspaceのモック</title>
  <desc>二分探索のStep 4。左に読みやすい等幅ソース、中央に配列・pointer・半開区間と装飾の差分、右に変数と選択要素、下に階層Timelineを配置する。サンプルデータによる静的なデザイン案。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans CJK JP', sans-serif; font-size: 14px; fill: #d4deed; }
      .mono, .mono text { font-family: 'DejaVu Sans Mono', 'Noto Sans CJK JP', monospace; font-size: 13px; }
      .dim { fill: #9aaac1; }
      .white { fill: #f1f5f9; }
      .blue { fill: #80b8ff; }
      .teal { fill: #59d5b1; }
      .amber { fill: #f4bd67; }
      .previous-warm { fill: #d6bea1; }
      .tiny { font-size: 12px; }
      .small { font-size: 13px; }
      .heading { font-size: 17px; font-weight: 600; fill: #edf2fb; }
      .value { font-family: 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 600; }
      .data { font-family: 'DejaVu Sans Mono', 'Noto Sans CJK JP', monospace; font-variant-numeric: tabular-nums; }
      .line { stroke: #2e3c52; stroke-width: 1; }
      .panel { fill: #111a2a; stroke: #29344a; }
    </style>
    <marker id="pointer" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#80b8ff"/>
    </marker>
  </defs>
  <rect width="1536" height="1024" fill="#0b1220"/>

  <!-- Application shell -->
  <rect width="1536" height="52" fill="#101827"/>
  <path d="M24 17h6v18h-6zm10 7h6v11h-6zm10-11h6v22h-6z" fill="#80b8ff"/>
  <text x="63" y="33" class="white" style="font-size:21px;font-weight:700">viz</text>
  <line x1="115" y1="15" x2="115" y2="37" class="line"/>
  <text x="134" y="32" class="white">binary_search.rs</text>
  <rect x="280" y="15" width="102" height="23" rx="5" fill="#1d2b41"/>
  <text x="294" y="31" class="tiny dim">lower_bound</text>
  <circle cx="1114" cy="27" r="4" fill="#59d5b1"/>
  <text x="1127" y="32" class="small">記録完了</text>
  <text x="1238" y="32" class="small">開く</text>
  <text x="1301" y="32" class="small">書き出す</text>
  <rect x="1401" y="12" width="112" height="29" rx="5" fill="#1b283d" stroke="#32415b"/>
  <text x="1422" y="32" class="small">レイアウト</text>
  <line x1="0" y1="52" x2="1536" y2="52" class="line"/>

  <!-- Playback stays visible even when timeline is closed -->
  <rect x="14" y="65" width="34" height="33" rx="5" fill="#172339"/>
  <path d="M33 74l-8 8 8 8" fill="none" stroke="#b9c7de" stroke-width="2"/>
  <rect x="56" y="65" width="48" height="33" rx="5" fill="#427cdb"/>
  <path d="M75 73l13 9-13 9z" fill="#fff"/>
  <rect x="112" y="65" width="34" height="33" rx="5" fill="#172339"/>
  <path d="M125 74l8 8-8 8" fill="none" stroke="#b9c7de" stroke-width="2"/>
  <text x="167" y="86" class="small">1.0×</text>
  <text x="221" y="86" class="small dim">一時停止</text>
  <line x1="299" y1="68" x2="299" y2="95" class="line"/>
  <text x="320" y="87" class="white data" style="font-size:17px;font-weight:600">Step 4 / 5</text>
  <text x="446" y="86">比較 #3</text>
  <text x="534" y="86" class="dim small">二分探索</text>
  <text x="1332" y="86" class="small">最新stepへ戻る</text>
  <path d="M1476 81h14m-5-5l5 5-5 5" fill="none" stroke="#d4deed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Source -->
  <rect x="12" y="112" width="354" height="600" rx="2" class="panel"/>
  <path d="M12 152h354" class="line"/>
  <text x="30" y="138" class="white">Source</text>
  <text x="116" y="138" class="dim">Objects</text>
  <line x1="27" y1="151" x2="86" y2="151" stroke="#80b8ff" stroke-width="2"/>
  <g fill="#9aaac1"><circle cx="326" cy="133" r="1.5"/><circle cx="332" cy="133" r="1.5"/><circle cx="338" cy="133" r="1.5"/></g>
  <text x="29" y="177" class="small dim">main.rs</text>
  <text x="215" y="177" class="tiny blue">記録地点: 16行</text>
  <rect x="13" y="518" width="352" height="23" fill="#233c60"/>
  <rect x="13" y="518" width="1" height="23" fill="#80b8ff"/>
  <g class="mono">
    <g fill="#61718c" text-anchor="end">
      <text x="41" y="204" class="dim">01</text><text x="41" y="226" class="dim">02</text>
      <text x="41" y="248" class="dim">03</text><text x="41" y="270" class="dim">04</text>
      <text x="41" y="292" class="dim">05</text><text x="41" y="314" class="dim">06</text>
      <text x="41" y="336" class="dim">07</text><text x="41" y="358" class="dim">08</text>
      <text x="41" y="380" class="dim">09</text><text x="41" y="402" class="dim">10</text>
      <text x="41" y="424" class="dim">11</text><text x="41" y="446" class="dim">12</text>
      <text x="41" y="468" class="dim">13</text><text x="41" y="490" class="dim">14</text>
      <text x="41" y="512" class="dim">15</text><text x="41" y="534" class="blue">16</text>
      <text x="41" y="556" class="dim">17</text><text x="41" y="578" class="dim">18</text>
      <text x="41" y="600" class="dim">19</text><text x="41" y="622" class="dim">20</text>
      <text x="41" y="644" class="dim">21</text><text x="41" y="666" class="dim">22</text>
      <text x="41" y="688" class="dim">23</text>
    </g>
    <g xml:space="preserve">
      <text x="53" y="204">let a = vec![1, 3, 4, 6, 8, 9,</text>
      <text x="53" y="226">             11, 15, 18, 21, 25, 30];</text>
      <text x="53" y="248">let target = 11;</text>
      <text x="53" y="270">let (mut l, mut r) = (0, a.len());</text>
      <text x="53" y="292" class="teal">viz::vars!(l, r, target);</text>
      <text x="53" y="314" class="teal">viz::view!("a", &amp;a);</text>
      <text x="53" y="336" class="teal">viz::step!("初期状態");</text>
      <text x="53" y="380" class="teal">let _s = viz::span!("二分探索");</text>
      <text x="53" y="402">while l &lt; r {</text>
      <text x="53" y="424">  let mid = l + (r - l) / 2;</text>
      <text x="53" y="446" class="teal">  viz::vars!(l, r, mid, target);</text>
      <text x="53" y="468" class="teal">  viz::mark!("mid", mid, on: "a");</text>
      <text x="53" y="490" class="teal">  viz::range!("search", l..r,</text>
      <text x="53" y="512" class="teal">              on: "a");</text>
      <text x="53" y="534" class="white">  viz::step!("比較");</text>
      <text x="53" y="578">  if a[mid] &lt; target {</text>
      <text x="53" y="600">    l = mid + 1;</text>
      <text x="53" y="622">  } else {</text>
      <text x="53" y="644">    r = mid;</text>
      <text x="53" y="666">  }</text>
      <text x="53" y="688">}</text>
    </g>
  </g>

